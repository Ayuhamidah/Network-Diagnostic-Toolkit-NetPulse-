name: network_diagnostic_toolkit
description: >
  Aplikasi Utilitas Jaringan (Network Diagnostic Toolkit) untuk troubleshooting
  jaringan dasar (ICMP Ping & MikroTik/Cisco TCP Port Probe, IPv4 Subnet/CIDR
  Calculator dengan Wildcard Mask, dan HTTP Server Status & Latency Checker).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dart_ping: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.21.0

flutter:
  uses-material-design: true
